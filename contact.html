<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Rama Samara</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <nav class="navbar">
            <div class="logo">Rama's Portfolio</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html" class="active">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        <section class="card form-card">
            <h2>Contact Me</h2>
            <p class="form-desc">Feel free to leave your message below, and I will get back to you as soon as possible.</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" placeholder="Enter your country">
                </div>

                <div class="form-group">
                    <label for="comments">Comments / Message</label>
                    <textarea id="comments" rows="5" placeholder="Write your comments here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rama Samara (169310) - Jordan University of Science and Technology</p>
    </footer>

    <!-- JavaScript Validation -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            // Prevent default submission
            event.preventDefault();

            // Fetch input values
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const country = document.getElementById('country').value.trim();
            const comments = document.getElementById('comments').value.trim();

            // Validate JavaScript logic
            if (fullName === "" || email === "" || country === "" || comments === "") {
                alert("Please fill in all fields before submitting!");
            } else {
                alert("Thank you! Your message has been submitted successfully.");
                document.getElementById('contactForm').reset();
            }
        });
    </script>

</body>
</html>
